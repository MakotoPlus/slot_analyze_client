name: GCP Deploy
#env:
#  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
 push:
   branches:
    - stg
    - prd

jobs:
  building:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        id: setup_node_id
        with:
          # node-version: 18
          cache: npm

      - name: node version
        run: node --version

      - name: Set Stage
        run: >
          if [[ "${{ github.head_ref }}" == "prd" || "${{ github.ref_name}}" == "prd" ]]; then
            echo "MY_STAGE=prd">> $GITHUB_ENV
            echo "SERVICE_NAME=slot-analyze-prd" >> $GITHUB_ENV
            echo "SERVICE_STAGE_NAME=/slot-analyze-front-prd" >> $GITHUB_ENV
            echo "COPY_STRAGE_PATH=gs://slot-analyze-front-prd" >> $GITHUB_ENV
            # echo "REACT_APP_AES_KEY=${{ secrets.PRD_REACT_APP_AES_KEY }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.PRD_NEXT_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.PRD_NEXT_PUBLIC_API_BASE_URL }}" > .env.production
          else
            echo "MY_STAGE=stg">> $GITHUB_ENV
            echo "SERVICE_NAME=slot-analyze-stg" >> $GITHUB_ENV
            echo "SERVICE_STAGE_NAME=/slot-analyze-front-stg" >> $GITHUB_ENV
            echo "COPY_STRAGE_PATH=gs://slot-analyze-front-stg" >> $GITHUB_ENV
            # echo "REACT_APP_AES_KEY=${{ secrets.STG_REACT_APP_AES_KEY }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.STG_NEXT_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.STG_NEXT_PUBLIC_API_BASE_URL }}" > .env.production
          fi

      - name: Checkout Environment Value
        run: >
            echo MY_STAGE=$MY_STAGE
            echo SERVICE_NAME ${{ env.SERVICE_NAME}}
            echo SERVICE_STAGE_NAME ${{ env.SERVICE_STAGE_NAME}}
            # echo NEXT_PUBLIC_API_BASE_URL ${{ env.NEXT_PUBLIC_API_BASE_URL}}
            echo NEXT_PUBLIC_API_BASE_URL ${{ env.NEXT_PUBLIC_API_BASE_URL}}

      - name: Cat .env.production
        run: cat .env.production
    
      #- name: Get npm cache directory
      #  id: npm-cache-dir
      #  shell: bash
      #  run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      #- uses: actions/cache@v4
      #  id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
      #  with:
      #    path: ${{ steps.npm-cache-dir.outputs.dir }}
      #    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      #    restore-keys: |
      #      ${{ runner.os }}-node-

      #- run: echo '${{ toJSON(steps.setup_node_id.outputs) }}'
      #- if: ${{ steps.setup_node_id.outputs.cache-hit != 'true' }}
      #  run: npm ci
      #- run: npm ls --depth=0

      - name: liblary install
        run: |
          npm ci
          npm ls --depth=0

      - name: node version
        run: node --version

      - name: Cat .env.production
        run: |
          cat ${{ github.workspace }}/.env.production

      # WARNING は無視するよう CI: False設定
      # CI = False Warning無視
      - name: build
        run: npm run build
        env:
          # NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          PUBLIC_URL: ${{ env.SERVICE_STAGE_NAME }}
          CI: false

      # エラーの確認
      - name: Debug info after build
        if: failure()
        run: |
          echo "Build failed. Checking for error logs..."
          if [ -f npm-debug.log ]; then
            echo "npm-debug.log contents:"
            cat npm-debug.log
          fi
          if [ -d build ]; then
            echo "Build directory contents:"
            ls -la build
          else
            echo "Build directory does not exist"
          fi

      - name: Cat .env.production
        run: cat .env.production

      - name: GCP login
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_KEY }}"

      - name: upload strage
        run: |
          gcloud storage cp -r ${{ github.workspace }}/build/* ${{ env.COPY_STRAGE_PATH }}/


